<tui-root [attr.tuiTheme]="resolvedTheme()">
  <div class="app-layout">
    <header class="topbar">
      <a class="brand" routerLink="/" aria-label="T-Retro, главная">
        <img src="retro-shield.svg" width="34" height="34" alt="" />
        <strong aria-hidden="true">РЕТРО</strong>
      </a>
      @if (meetingHeader.title(); as title) {
        <div class="meeting-heading">
          <h1 class="meeting-title" id="meeting-title">{{ title }}</h1>
          <ng-container [ngTemplateOutlet]="meetingHeader.invite()" />
        </div>
      }
      <div class="controls">
        <button class="icon-button" tuiButton type="button" appearance="secondary" size="s"
          [attr.aria-label]="themeHint()" [tuiHint]="themeHint()" (click)="cycleTheme()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            @switch (theme()) {
              @case ('light') {
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
              }
              @case ('dark') {
                <path d="M20.5 14a8.5 8.5 0 0 1-10.5-10.5A8.5 8.5 0 1 0 20.5 14Z" />
              }
              @default {
                <rect x="3" y="4" width="18" height="13" rx="2" />
                <path d="M12 17v3m-4 0h8" />
              }
            }
          </svg>
        </button>
        @if (auth.user(); as employee) {
          <div class="account">
            <span class="account-name">{{ employee.displayName }}</span>
            <button class="icon-button" tuiButton type="button" appearance="secondary" size="s"
              aria-label="Выйти" tuiHint="Выйти" (click)="logout()">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5m4-12 4 4-4 4m4-4H8" />
              </svg>
            </button>
          </div>
        }
      </div>
    </header>
    @if (!connection.online()) {
      <div class="connection-banner" role="status">Нет сети. Изменения временно недоступны.</div>
    }
    <router-outlet />
  </div>
</tui-root>
