<div class="columns">
  @for (column of columns(); track $index) {
    <div class="column-row">
      <tui-textfield>
        <input
          tuiTextfield
          aria-label="Название колонки"
          [name]="'column-name-' + $index"
          [(ngModel)]="column.name"
          required
          maxlength="120" />
      </tui-textfield>
      <input
        class="color"
        type="color"
        aria-label="Цвет колонки"
        [name]="'column-color-' + $index"
        [(ngModel)]="column.color"
        required
        pattern="#[0-9A-Fa-f]{6}" />
      <div class="actions">
        <button tuiButton type="button" appearance="secondary" aria-label="Переместить выше" (click)="move($index, -1)" [disabled]="$first">↑</button>
        <button tuiButton type="button" appearance="secondary" aria-label="Переместить ниже" (click)="move($index, 1)" [disabled]="$last">↓</button>
        <button tuiButton type="button" appearance="secondary" aria-label="Удалить колонку" (click)="remove($index)">Удалить</button>
      </div>
    </div>
  }
</div>
<button tuiButton type="button" appearance="secondary" (click)="add()">Добавить колонку</button>
