name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: t_retro_test
          POSTGRES_USER: t_retro
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U t_retro -d t_retro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup npm
        run: npm install --global npm@12.1.0

      - name: Build and test
        run: ./tools/build.sh
        shell: bash

      - name: Verify PostgreSQL API and browser workflows
        env:
          TRETRO_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=t_retro_test;Username=t_retro
          NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget/packages
        run: |
          dotnet test tests/Api.Tests/Api.Tests.csproj --no-build --no-restore --verbosity minimal
          cd web
          TRETRO_E2E_POSTGRES="$TRETRO_TEST_POSTGRES" npm run test:e2e
